name: CouchRemote

options:
  bundleIdPrefix: com.adityakolte.couchremote
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    DEVELOPMENT_TEAM: 5PYDBJJN92
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "10"

packages:
  RemoteKit:
    path: Packages/RemoteKit

schemes:
  RemoteMac:
    build:
      targets:
        RemoteMac: all
    run:
      config: Debug
    archive:
      config: Release
  RemoteiPhone:
    build:
      targets:
        RemoteiPhone: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  RemoteMac:
    type: application
    platform: macOS
    sources:
      - path: RemoteMac
    dependencies:
      - package: RemoteKit
    info:
      path: RemoteMac/Info.plist
      properties:
        CFBundleName: CouchRemote
        CFBundleDisplayName: CouchRemote
        # XcodeGen otherwise writes literal 1.0 / 1; take them from the build settings below.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSLocalNetworkUsageDescription: CouchRemote listens for your iPhone on the local network.
        NSBonjourServices:
          - _couchremote._tcp
    settings:
      base:
        PRODUCT_NAME: CouchRemote
        PRODUCT_BUNDLE_IDENTIFIER: com.adityakolte.couchremote.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES

  RemoteiPhone:
    type: application
    platform: iOS
    sources:
      - path: RemoteiPhone
    dependencies:
      - package: RemoteKit
    info:
      path: RemoteiPhone/Info.plist
      properties:
        CFBundleName: CouchRemote
        CFBundleDisplayName: CouchRemote
        # XcodeGen otherwise writes literal 1.0 / 1; take them from the build settings below.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: CouchRemote connects to your Mac on the local network to control it.
        NSCameraUsageDescription: CouchRemote scans the QR code on your Mac to pair with it.
        # Only standard system TLS; declared once so App Store Connect doesn't ask on every build.
        ITSAppUsesNonExemptEncryption: false
        NSBonjourServices:
          - _couchremote._tcp
        CFBundleURLTypes:
          - CFBundleURLName: com.adityakolte.couchremote
            CFBundleURLSchemes:
              - couchremote
    settings:
      base:
        PRODUCT_NAME: CouchRemote
        PRODUCT_BUNDLE_IDENTIFIER: com.adityakolte.couchremote.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
